{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gophprofile.fullname" . }}-alerts
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: gophprofile.availability
    rules:
    - alert: GophProfileTargetDown
      expr: up{job=~".*gophprofile.*"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "GophProfile scrape target down"
        description: "Prometheus cannot scrape {{`{{ $labels.job }}`}} / {{`{{ $labels.instance }}`}} for more than 2 minutes."

    - alert: GophProfilePodNotReady
      expr: kube_deployment_status_replicas_unavailable{deployment=~"{{ include "gophprofile.name" . }}.*"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "GophProfile pods not ready"
        description: "Deployment {{`{{ $labels.deployment }}`}} has {{`{{ $value }}`}} unavailable replicas."

    - alert: GophProfileHighErrorRate
      expr: |
        (
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
        ) > {{ .Values.prometheusRule.thresholds.errorRate }}
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High HTTP 5xx rate"
        description: "GophProfile 5xx ratio is {{`{{ $value | humanizePercentage }}`}} over 5 minutes."

    - alert: GophProfileHighLatency
      expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > {{ .Values.prometheusRule.thresholds.latencyP95Seconds }}
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High HTTP p95 latency"
        description: "p95 request latency is {{`{{ $value }}`}}s."

    - alert: GophProfileQueueDepthHigh
      expr: broker_queue_depth > {{ .Values.prometheusRule.thresholds.queueDepth }}
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "RabbitMQ queue backlog"
        description: "Queue {{`{{ $labels.queue }}`}} depth is {{`{{ $value }}`}}."

    - alert: GophProfileHPAAtMax
      expr: |
        kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~".*gophprofile.*"}
        >=
        kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~".*gophprofile.*"}
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "HPA at max replicas"
        description: "{{`{{ $labels.horizontalpodautoscaler }}`}} has been at max replicas for 15 minutes."
{{- end }}
