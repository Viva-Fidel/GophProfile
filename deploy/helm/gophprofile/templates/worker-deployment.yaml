{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.fullname" . }}-worker
  labels:
    {{- include "gophprofile.worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gophprofile.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gophprofile.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: worker
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["./worker"]
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: metrics
          containerPort: {{ .Values.worker.metricsPort }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: METRICS_ADDRESS
          value: {{ printf ":%v" .Values.worker.metricsPort | quote }}
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: s3_endpoint
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: s3_bucket
        - name: S3_USE_SSL
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: s3_use_ssl
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: log_level
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.worker.otelServiceName | quote }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: otel_exporter_otlp_endpoint
        - name: OTEL_EXPORTER_OTLP_INSECURE
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: otel_exporter_otlp_insecure
        - name: OTEL_TRACING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: {{ include "gophprofile.fullname" . }}-config
              key: otel_tracing_enabled
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: {{ include "gophprofile.fullname" . }}-secrets
              key: database-uri
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "gophprofile.fullname" . }}-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "gophprofile.fullname" . }}-secrets
              key: s3-secret-key
        - name: RABBITMQ_URI
          valueFrom:
            secretKeyRef:
              name: {{ include "gophprofile.fullname" . }}-secrets
              key: rabbitmq-uri
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: {{ .Values.worker.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.worker.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.worker.probes.liveness.failureThreshold }}
        readinessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: {{ .Values.worker.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.worker.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.worker.probes.readiness.failureThreshold }}
          successThreshold: {{ .Values.worker.probes.readiness.successThreshold }}
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
