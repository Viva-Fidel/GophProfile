apiVersion: v1
kind: Namespace
metadata:
  name: gophprofile
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gophprofile
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gophprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: gophprofile
        - name: POSTGRES_PASSWORD
          value: gophprofile
        - name: POSTGRES_DB
          value: gophprofile
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "gophprofile", "-d", "gophprofile"]
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: gophprofile
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: gophprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine
        ports:
        - containerPort: 5672
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: gophprofile
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 4566
---
# LocalStack as S3-compatible store (MinIO image unavailable on this host)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: gophprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: localstack/localstack:3.8
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICES
          value: s3
        - name: DEBUG
          value: "0"
        ports:
        - containerPort: 4566
        readinessProbe:
          httpGet:
            path: /_localstack/health
            port: 4566
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile-worker
  namespace: gophprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gophprofile-worker
  template:
    metadata:
      labels:
        app: gophprofile-worker
    spec:
      containers:
      - name: worker
        image: gophprofile:latest
        imagePullPolicy: Never
        command: ["./worker"]
        env:
        - name: DATABASE_URI
          value: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
        - name: S3_ENDPOINT
          value: minio:9000
        - name: S3_ACCESS_KEY
          value: test
        - name: S3_SECRET_KEY
          value: test
        - name: S3_BUCKET
          value: avatars
        - name: S3_USE_SSL
          value: "false"
        - name: RABBITMQ_URI
          value: amqp://guest:guest@rabbitmq:5672/
        - name: OTEL_TRACING_ENABLED
          value: "false"
        - name: METRICS_ADDRESS
          value: ":9091"
        - name: LOG_LEVEL
          value: debug
        ports:
        - containerPort: 9091
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
