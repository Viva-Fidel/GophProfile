apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secrets
  labels:
    app: gophprofile
type: Opaque
# Замените значения на base64-кодированные секреты, например:
# echo -n 'postgres://user:pass@postgres:5432/gophprofile?sslmode=disable' | base64
data:
  database-uri: <base64-encoded>
  s3-access-key: <base64-encoded>
  s3-secret-key: <base64-encoded>
  rabbitmq-uri: <base64-encoded>
