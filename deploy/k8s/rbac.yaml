apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile
  labels:
    app: gophprofile
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gophprofile
  labels:
    app: gophprofile
rules:
- apiGroups: ["policy"]
  resources: ["podsecuritypolicies"]
  resourceNames: ["gophprofile"]
  verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gophprofile
  labels:
    app: gophprofile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gophprofile
subjects:
- kind: ServiceAccount
  name: gophprofile
