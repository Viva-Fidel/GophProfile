{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.fullname" . }}-grafana-dashboards
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  gophprofile-k8s.json: |-
{{ .Files.Get "files/dashboards/gophprofile-k8s.json" | indent 4 }}
  gophprofile-overview.json: |-
{{ .Files.Get "files/dashboards/gophprofile-overview.json" | indent 4 }}
{{- end }}
