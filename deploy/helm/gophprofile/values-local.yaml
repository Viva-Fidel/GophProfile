replicaCount: 1

image:
  repository: gophprofile
  tag: latest
  pullPolicy: Never

ingress:
  enabled: false

autoscaling:
  enabled: false

migrations:
  enabled: false

config:
  runAddress: ":8080"
  publicUrl: "http://localhost:18080"
  s3Endpoint: "172.17.0.1:9000"
  s3Bucket: "avatars"
  s3UseSSL: "false"
  logLevel: "debug"
  otelTracingEnabled: "false"
  otelExporterOtlpEndpoint: "localhost:4317"

secrets:
  databaseUri: "postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable"
  s3AccessKey: "test"
  s3SecretKey: "test"
  rabbitmqUri: "amqp://guest:guest@rabbitmq:5672/"

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

grafanaDashboard:
  enabled: false

worker:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false

networkPolicy:
  enabled: false

podSecurityPolicy:
  enabled: false
